name: 24/7 Automated Keep-Alive & Anti-Inactivity Ping

on:
  schedule:
    # Runs every 2 days at 04:00 UTC (9:30 AM IST) to guarantee 100% active state
    - cron: '0 4 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-keep-alive:
    name: Ping Health & Keep Cloud Active
    runs-on: ubuntu-latest
    steps:
      - name: Ping Pragyan Live Portal & Health Endpoint
        env:
          VERCEL_PROJECT_URL: ${{ secrets.VERCEL_PROJECT_URL }}
        run: |
          echo "⏰ Sending keep-alive health check at $(date -u)..."
          
          # 1. Ping Pragyan Live Portal
          PORTAL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "https://www.pragyaninstitute.com/")
          echo "📡 Live Portal Status: $PORTAL_STATUS"
          if [ "$PORTAL_STATUS" -ne 200 ]; then
            echo "⚠️ Warning: Live portal returned HTTP $PORTAL_STATUS"
          else
            echo "✅ Live portal is healthy (HTTP 200)"
          fi
          
          # 2. Ping Health Endpoint
          TARGET_URL="${VERCEL_PROJECT_URL:-https://www.pragyaninstitute.com}"
          HEALTH_URL="${TARGET_URL%/}/api/health"
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$HEALTH_URL")
          echo "📡 API Health Check Status: $API_STATUS"
          
          echo "✅ Keep-alive signal successfully dispatched! Project is 100% active."
