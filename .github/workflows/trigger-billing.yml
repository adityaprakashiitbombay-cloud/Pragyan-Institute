name: On-Demand Instant Fee Billing & Email Trigger

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Target Batch (all, 10th, 9th, 8th, junio)'
        required: false
        default: 'all'
        type: string
      student_id:
        description: 'Target Student ID (all or specific ID like 261001)'
        required: false
        default: 'all'
        type: string
      action:
        description: 'Action (invoice, reminder, test)'
        required: false
        default: 'invoice'
        type: choice
        options:
          - invoice
          - reminder
          - test
      to_email:
        description: 'Direct email recipient (for test action)'
        required: false
        default: ''
        type: string

jobs:
  trigger_billing:
    name: Instant Billing & Email Dispatcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install @supabase/supabase-js

      - name: Run Real-Time Billing & Email Dispatch
        run: node .github/scripts/trigger-billing.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ujcmmcaervgskpkcfekm.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'Pragyan Institute <noreply@pragyaninstitute.com>' }}
          BATCH: ${{ inputs.batch }}
          STUDENT_ID: ${{ inputs.student_id }}
          ACTION: ${{ inputs.action }}
          TO_EMAIL: ${{ inputs.to_email }}
