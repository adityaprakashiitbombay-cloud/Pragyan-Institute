name: Monthly Fee Billing & Reminders Automation
# Runs on the 1st–4th of each month for Billing and 15th-18th for Reminders at 6 AM IST (00:30 UTC)
# Also triggerable manually from GitHub Actions tab

on:
  schedule:
    # 1st-4th: Fee Invoicing
    - cron: '30 0 1 * *'   # 1st  → Class 10th (ACHIEVER)
    - cron: '30 0 2 * *'   # 2nd  → Class 9th  (NURTURE)
    - cron: '30 0 3 * *'   # 3rd  → Class 8th  (ALPHA)
    - cron: '30 0 4 * *'   # 4th  → Junior     (JUNIO)
    # 15th-18th: Fee Due Reminders
    - cron: '30 0 15 * *'  # 15th → Class 10th (ACHIEVER) Reminder
    - cron: '30 0 16 * *'  # 16th → Class 9th  (NURTURE) Reminder
    - cron: '30 0 17 * *'  # 17th → Class 8th  (ALPHA) Reminder
    - cron: '30 0 18 * *'  # 18th → Junior     (JUNIO) Reminder
  workflow_dispatch:
    inputs:
      force_day:
        description: 'Override day of month (1-4 or 15-18) for manual testing'
        required: false
        type: string

jobs:
  billing:
    name: Generate Monthly Fees & Reminders
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run fee billing script
        run: node .github/scripts/monthly-fees.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ujcmmcaervgskpkcfekm.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'Pragyan Institute <noreply@pragyaninstitute.com>' }}
          FORCE_DAY: ${{ inputs.force_day }}
