name: Monthly Fee Billing (manual backstop)

# NOTE ON SCHEDULING
# ------------------
# This workflow no longer runs on a cron. The scheduler is Vercel:
# vercel.json runs /api/cron-monthly-fees at 04:00 UTC on the 1st-10th, which is
# the 10-day rolling calendar in api/_lib/academic-config.js.
#
# The cron entries that used to live here fired on days 1-4 and 15-18 against a
# separate billing engine in .github/scripts/. That was not merely redundant:
#
#   * Charges are idempotent (fee_billing_ledger has a unique idempotency_key),
#     but whichever engine reached a student FIRST decided the amount, and this
#     side's fee table under-billed Class 11th and 12th by 500/month.
#   * Statement emails are claim-gated, so a duplicate run cannot re-send one.
#     Reminders are deduplicated per recipient per IST day by the quota ledger,
#     so a same-day duplicate run is now safe too — but two schedulers still
#     means two chances to diverge, and no benefit.
#
# So this workflow is now a manual re-run button: use it when a Vercel cron
# invocation fails or is missed. Replaying a day cannot bill anyone twice.

on:
  workflow_dispatch:
    inputs:
      force_day:
        description: 'Billing calendar day to run (1-10). Blank = today.'
