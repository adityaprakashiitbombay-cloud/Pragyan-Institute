name: Monthly Fee Billing & Reminders Automation
# Runs on the 1st-10th of each month (staggered billing days 1-6 + reminder
# days 7-10) and the 15th for mid-month follow-up at 6 AM IST (00:30 UTC).
# Must stay in sync with BATCH_SCHEDULE in api/cron-monthly-fees.js.
# Also triggerable manually from GitHub Actions tab

on:
  schedule:
    # Days 1-6: staggered fee invoicing | Days 7-10: due reminders
    - cron: '30 0 1-10 * *'
    # Day 15: mid-month follow-up / pending ledger sync
    - cron: '30 0 15 * *'
  workflow_dispatch:
    inputs:
      force_day:
        description: 'Override day of month (1-10 or 15) for manual testing'
        required: false
        type: string

jobs:
  billing:
    name: Generate Monthly Fees & Reminders
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run fee billing script
        run: node .github/scripts/monthly-fees.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ujcmmcaervgskpkcfekm.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'Pragyan Institute <noreply@pragyaninstitute.com>' }}
          FORCE_DAY: ${{ inputs.force_day }}
